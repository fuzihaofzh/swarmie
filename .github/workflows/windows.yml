name: Cross-platform shell compatibility
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
jobs:
  compatibility:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:platform
      - if: runner.os == 'Windows'
        run: npm run test:windows
      - if: runner.os != 'Windows'
        run: npm test
